name: VSIX Release

on:
  push:
    branches:
      - main

# 古い実行が最新版の公開を妨げないよう、同時実行を避ける。
concurrency:
  group: vsix-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        env:
          RELEASE_SEQUENCE: ${{ github.run_number }}
          TZ: Asia/Tokyo
        run: npm run package

      - name: Prepare latest asset
        id: asset
        run: |
          version="$(node -p "require('./package.json').version")"
          mv "vscode-codex-extension-${version}.vsix" vscode-codex-extension.vsix
          packaged_version="$(unzip -p vscode-codex-extension.vsix extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          test "$packaged_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.asset.outputs.version }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "main moved to $main_sha; skipping obsolete build $GITHUB_SHA"
            exit 0
          fi

          if release_draft="$(gh release view "v${RELEASE_VERSION}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$release_draft" = false ]; then
              echo "v${RELEASE_VERSION} is already published"
              exit 0
            fi
            echo "::error::v${RELEASE_VERSION} already exists as a draft release"
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::v${RELEASE_VERSION} already exists as a tag"
            exit 1
          fi

          gh release create "v${RELEASE_VERSION}" vscode-codex-extension.vsix \
            --target "$GITHUB_SHA" \
            --title "v${RELEASE_VERSION}" \
            --latest \
            --notes "mainの${GITHUB_SHA}から自動生成したVSIXです。"
