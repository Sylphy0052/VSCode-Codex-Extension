# mainへのpushとPRのたびにlint / typecheck / testを自動実行する。
# 統合テスト（test:integration）はVSCodeのダウンロードとxvfbが必要なため対象外（Issue #360）。
# ブランチ保護のrequired status checksはこのワークフローでは設定しない。
# 必須化の手順・チェック名・判断のタイミングはdocs/repository-hygiene.mdを参照。
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 同一ブランチ・同一PRへの連続pushで複数のCI実行が並走しないようにする。
# 古い実行を残しても結果を使わないため、新しいpushが来たら古い実行はキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 必要最小限の権限のみ付与する（チェックアウトとログ閲覧のみで足りるためcontents: read）。
permissions:
  contents: read

jobs:
  check:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    # 既定の360分は長すぎるため妥当な値に短縮する。
    # ローカルでのscripts/check.sh全体の所要は30秒強であり、依存インストール（npm ci）を
    # 含めても10分あれば十分に足りるため、10分をタイムアウトとする。
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
