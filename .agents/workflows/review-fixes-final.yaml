version: 1
name: review-fixes-final-2026-08-22
# 2026-08-22の全体レビューの仕上げ。eslintの型情報ルール導入は src 全体へ波及するため、
# 他のすべての実装が完了してから着手する（ロードマップの第3波 WF-G）。
#
# このファイルの役割は「各タスクの詳細指示（根拠・変更内容・受入基準・自己レビュー手順）の
# 原本」であり、タスクの担当分けはここでは決めない。現行の分割は
# docs/roadmap/review-and-feature-consolidation.md を見ること。
# 元々の core / ui / final の3分割は、そのロードマップの7ワークフロー（WF-A〜WF-G）へ
# 置き換わっている。このファイルの maxParallel / provider の指定も、分割の変更にともなって
# 参考値として扱う。
#
# 各タスクのpromptには「検証済み」「未検証」を明記してある。検証済みはレビュー時に
# 実際のコードを読んで根拠を確認したもの、未検証は監査エージェントの報告のままで
# 裏取りが済んでいないもの。未検証のタスクは修正前に再現条件の確認から始める。
#
# dependsOn は論理的な前後関係だけでなく、同じファイルを触るタスク同士の直列化にも
# 使っている。担当の分け方が変わっても、この前後関係は守ること。
#
# レビューは2段構えにしてある。
#  1. 各タスクが自分の差分を自己レビューしてから完了する（doneの条件に含めてある）
#  2. ワークフローの最後に全体レビューを1段置く（Z01_core_review / Z02_ui_review /
#     T27_final_review がその指示の原本）
#
# なお `done` の末尾には、拡張のワークフロー機能で実行する場合に限り runner が自動で
# 「かつすべての変更をコミットしてあること」を付け足す
# （src/orchestrator/runner.ts:1421 の withCommitRequirement）。
# 今回はワークフロー機能では実行しないため、コミットとPRは上記ロードマップの運用規約に従う。
defaults:
  provider: codex
  maxParallel: 1
  isolation: worktree
  cleanup: after-merge
  type: fix
  maxIterations: 20

tasks:
  - id: T26_eslint_typed
    type: chore
    prompt: |
      eslintに型情報を要するルールを導入し、未処理Promiseを機械的に検出できるようにする。
      src全体へ波及するため、他のすべての修正が入った後に実行する。

      根拠（監査エージェントの報告。着手前に自分で確認すること）:
      - eslint.config.mjs の tseslint.config() に languageOptions.parserOptions.project が
        設定されておらず、型情報を要するルール（no-floating-promises / no-misused-promises /
        no-unsafe-* 等）が原理的に有効化できない構成になっている
      - src/view/claudeChatView.ts:1271 のように手動で void を付けている箇所がある一方、
        機械チェックは存在しない
      - このレビューで見つかった未ハンドルreject（runner.ts の void integratePseudoWorktree など）は
        まさにこのルールが捕まえる型の不具合

      変更内容:
      - tseslint.configs.recommendedTypeChecked 系へ移行し、parserOptions.project を設定する
      - no-floating-promises を有効にする
      - 有効化すると既存コードで多数の警告が出るはずなので、1件ずつ確認して対処する。
        単に void を付けて黙らせるのではなく、「本当に待たなくてよいのか」
        「失敗をどこで受けるのか」を判断すること。判断に迷うものは報告して残してよい
      - 型チェック付きルールはlintの実行時間を延ばすため、実行時間を計測して報告する。
        許容できない場合は対象ファイルを絞る設定を検討する
      - CIのlintステップが通ることを確認する（T01で追加済み）
      - @vitest/coverage-v8 の導入も行う。ただしカバレッジ閾値の設定は既存テストの実態を
        測ってから決めること（いきなり80%を強制するとCIが赤くなる）。
        このタスクでは計測できる状態にするところまでを担当し、閾値は設定しない

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、void を付けただけで済ませた箇所が無いか確認する
        （付けた場合はなぜ待たなくてよいのかをコメントで説明すること）
      - eslint-disable コメントで黙らせた箇所が無いか確認する。ある場合は理由を明記する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - no-floating-promises が有効になっていること
      - npm run lint が警告ゼロで通ること
      - npm test / npm run typecheck が全緑
      - カバレッジが計測できる状態になっていること
      - lintの実行時間が報告されていること
    done: no-floating-promises が有効になり npm run lint が警告ゼロで通りカバレッジが計測可能になり、全テストが緑で、差分の自己レビューを終えていること

  - id: T27_final_review
    provider: claude
    type: refactor
    dependsOn: [T26_eslint_typed]
    prompt: |
      統合ブランチに入った全変更をまとめてレビューする。このタスクは実装ではなくレビューが主目的。

      背景: 2026-08-22の全体レビューで挙がった指摘は、担当を分けた2つのワークフロー
      （review-fixes-core.yaml のワークフロー基盤側20タスクと、review-fixes-ui.yaml の
      View層5タスク）で修正済みである。それぞれの中では横断レビュー（Z01 / Z02）も
      済んでいるが、両者を跨いだ整合はまだ誰も見ていない。それをここで見る。
      各タスクは自分の差分を自己レビューしているが、タスク横断の問題
      （タスク間の矛盾、重複した修正、片方だけ直された非対称、統合時に生まれた不整合）は
      個々のタスクからは見えない。それをここで拾う。

      あなたのworktreeは統合ブランチから切られているため、先行する全タスクの成果が入っている。

      レビュー手順:
      1. まず `git log --oneline` と `git diff` でこのrunが加えた変更の全体像を把握する
         （比較対象は main。`git diff main...HEAD` で差分を取る）
      2. 次の観点で通しでレビューする:
         - タスク間の矛盾: 同じ問題を2つのタスクが別々の方法で直していないか
         - 非対称の残存: Codex側だけ直してClaude側が残っている、dispose だけ直して
           exit ハンドラが残っている、といった片側修正が無いか
           （このレビューで見つかった不具合の多くがこの型だったため、特に注意して見ること）
         - 抽象化の破れ: T10 で作った untrusted テキストの整形モジュールを
           通っていない経路が新たに増えていないか
         - リースや解放の対称性: T21 で導入したリースがあれば、取得と解放が
           例外経路でも対になっているか
         - エラーの握り潰し: catch でログも状態遷移もせず握り潰している箇所が無いか
         - テストの質: 「呼ばれたことだけ確認して結果を見ていない」弱いアサーションが無いか
         - セキュリティ: 子プロセスの引数組み立て、パス検証、webviewのCSP、
           外部由来テキストの扱いが弱まっていないか
      3. 見つけた問題のうち、その場で直せるものは直す
      4. 直せないもの・判断が要るものは、docs/ 配下にレビュー結果の文書として残す
         （file:line と根拠、なぜ直さなかったかを書く）

      重要:
      - 「問題なし」で終わらせないこと。2つのワークフロー計25タスク分の変更が入っており、
        しかもそれらは互いの作業を見ずに並行して進んでいる以上、
        横断的な見落としが1つも無い可能性は低い。最低でも各観点について
        「確認した結果どうだったか」を書くこと
      - 一方で、無理に問題をでっち上げないこと。確認して問題が無かった観点は
        「確認済み、問題なし」と書けばよい
      - 大規模な作り直しには広げない。このタスクの目的は横断的な不整合の是正であって、
        新しい設計の導入ではない

      受入基準:
      - docs/ 配下にレビュー結果の文書が追加されていること
      - 上記の各観点について確認結果が書かれていること
      - その場で直した問題があれば、その差分が含まれていること
      - npm test / npm run typecheck / npm run lint が全緑
    done: 統合ブランチの全変更が横断的にレビューされ結果が docs 配下の文書に残り、直せる問題は修正され、全テストが緑であること
