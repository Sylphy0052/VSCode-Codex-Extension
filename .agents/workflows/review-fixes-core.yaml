    done: 疑似worktreeの統合・反映の失敗が捕捉されてタスクが確定し、それを検証する回帰テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T08_stop_and_persist
    dependsOn: [T07_pseudo_worktree_catch]
    prompt: |
      「全体の停止」が衝突解決セッションを止めない問題と、永続化の時点ずれを直す。

      根拠（いずれも監査エージェントの報告。着手前に自分で確認すること）:

      1. 衝突解決セッションが停止対象から漏れている
         - src/orchestrator/runner.ts:1274 の stop() は live.tasks しか走査しておらず、
           src/orchestrator/runner.ts:763 付近で管理している live.mergeResolutions
           （統合worktree上で開く衝突解決セッション）へ stopLoop() を送っていない
         - Issue #322 が問題視した「停止ボタンを押しても指示が送られ続ける」状態が、
           衝突解決セッションについてはそのまま残っている

      2. stop() が pump() を呼ばない
         - ライブセッションが1つも無いrun（リロード後の復元済みなど）を停止したとき、
           run終了時の後始末（transport.close / clearInterval / オーケストレーターへの終了通知、
           runner.ts:1830 付近）が一度も走らない可能性がある

      3. persist の outcome が別時点の値になる
         - src/orchestrator/runner.ts:2570 の persist() は outcome を呼び出し時点で計算する一方、
           store.update に渡す updater は直列キューが捌く時点の live.runState / live.tasks を読む
         - 両者が別時点の値になるため、終了済みのタスク一覧に finishedAt: undefined が付く、
           あるいは早すぎる finishedAt が固定される（`current?.finishedAt ?? ...` で上書き不能）

      補足（レビューで確認済みの事実。誤解しないこと）: stop() 自体は正しく動作しており、
      live.tasks 側の running / waitingApproval / waitingReply には stopLoop() が送られている。
      applyLoopStopReason の manual 経路も設計どおり haltedByUser を立てる。
      不足しているのは mergeResolutions の走査と pump の呼び出し。

      変更内容:
      - stop() で live.mergeResolutions の各セッションにも stopLoop() を送る
      - 停止された衝突解決セッションが onMergeResolutionFinished の manual / interrupted 経路へ
        合流し、タスクが適切な状態へ落ちることを確認する
      - stop() の末尾で pump(runId) を呼ぶべきか確認し、必要なら追加する
      - persist の updater の内側で getRunOutcome を計算するよう直す

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、pump の追加が停止処理中に新しいタスクを開始してしまわないか
        確認する（haltedByUser が立っている状態で pump が何をするかを必ず追うこと）
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - 衝突解決セッションが走っている状態で stop() を呼ぶと、そのセッションにも
        stopLoop() が送られることを検証する回帰テストを追加する
      - ライブセッションが無いrunを停止したときに後始末が走ることを確認する
      - persist の outcome とタスク一覧が同一時点の値になることを検証するテストを追加する
      - npm test / npm run typecheck / npm run lint が全緑
    done: stop() が衝突解決セッションも停止し pump を通し、persist の時点ずれが解消され、回帰テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T09_forge
    prompt: |
      PR/MR操作の2件の不具合を直す。

      根拠（いずれも監査エージェントの報告。着手前に自分で確認すること）:

      1. マージが番号なしで実行される（重大）
         - src/orchestrator/forge.ts:897 の buildFinalMergeArgs は
           `gh pr merge --merge` / `glab mr merge --remove-source-branch` を番号なしで実行している
         - 番号を省略すると、マージ対象は「cwd（統合worktree）のカレントブランチに紐づくPR/MR」という
           暗黙の状態依存になる。ブランチがずれていれば無関係のPR/MRがmainへマージされる
         - 直前に呼ばれる markPullRequestReady は src/orchestrator/runner.ts:2300 付近で
           live.integrationPullRequest.number を持っているため、同じ番号をマージにも渡せる

