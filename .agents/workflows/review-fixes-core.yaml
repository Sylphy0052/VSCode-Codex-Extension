      - T17_stream_robustness
      - T19_session_perf
      - T20_orchestrator_warn
      - T21_integration_lock
      - T25_repo_hygiene
    prompt: |
      統合ブランチに入った全変更をまとめてレビューする。このタスクは実装ではなくレビューが主目的。

      背景: このワークフローは2026-08-22の全体レビューで挙がった指摘のうち、
      ワークフロー基盤側（orchestrator / loop / appserver / claude / codex / session / extension）を
      20タスクで修正してきた。各タスクは自分の差分を自己レビューしているが、
      タスク横断の問題（タスク間の矛盾、重複した修正、片方だけ直された非対称、
      統合時に生まれた不整合）は個々のタスクからは見えない。それをここで拾う。

      あなたのworktreeは統合ブランチから切られているため、先行する全タスクの成果が入っている。

      重要: View層（src/view/）は別のワークフロー（review-fixes-ui.yaml）が担当している。
      このレビューでは src/view/ を変更しないこと。src/view/ に問題を見つけた場合は
      修正せず、報告書へ記録するだけにとどめる（別担当が同じファイルを触っているため、
      ここで直すと衝突する）。

      レビュー手順:
      1. まず `git log --oneline` と `git diff main...HEAD` でこのrunが加えた変更の全体像を把握する
      2. 次の観点で通しでレビューする:
         - タスク間の矛盾: 同じ問題を2つのタスクが別々の方法で直していないか
         - 非対称の残存: dispose だけ直して exit ハンドラが残っている、Codex側だけ直して
           Claude側が残っている、といった片側修正が無いか
           （このレビューで見つかった不具合の多くがこの型だったため、特に注意して見ること）
         - 抽象化の破れ: T10 で作った untrusted テキストの整形モジュールを
           通っていない経路が新たに増えていないか
         - リースや解放の対称性: T21 でリースを導入した場合、取得と解放が
           例外経路でも対になっているか（解放漏れはデッドロックになる）
         - エラーの握り潰し: catch でログも状態遷移もせず握り潰している箇所が無いか
         - 状態機械の一貫性: T02 で isUnsettled に waitingReply を足した影響が、
           他の状態判定（isActiveTaskState / getRunOutcome）と矛盾していないか
         - テストの質: 「呼ばれたことだけ確認して結果を見ていない」弱いアサーションが無いか
         - セキュリティ: 子プロセスの引数組み立て、パス検証、外部由来テキストの扱いが
           弱まっていないか。特に git の破壊的操作（worktree削除・merge --abort）の
           発火条件が広がっていないか
      3. 見つけた問題のうち、その場で直せるものは直す（src/view/ を除く）
      4. 直せないもの・判断が要るものは、docs/ 配下にレビュー結果の文書として残す
         （file:line と根拠、なぜ直さなかったかを書く）

      重要:
      - 「問題なし」で終わらせないこと。20タスク分の変更が入っている以上、
        横断的な見落としが1つも無い可能性は低い。最低でも各観点について
        「確認した結果どうだったか」を書くこと
      - 一方で、無理に問題をでっち上げないこと。確認して問題が無かった観点は
        「確認済み、問題なし」と書けばよい
      - 大規模な作り直しには広げない。目的は横断的な不整合の是正であって、
        新しい設計の導入ではない

      受入基準:
      - docs/ 配下にレビュー結果の文書が追加されていること
      - 上記の各観点について確認結果が書かれていること
      - その場で直した問題があれば、その差分が含まれていること
      - src/view/ を変更していないこと
      - npm test / npm run typecheck / npm run lint が全緑
    done: ワークフロー基盤側の全変更が横断的にレビューされ結果が docs 配下の文書に残り、直せる問題は修正され、src/view/ を変更しておらず、全テストが緑であること
