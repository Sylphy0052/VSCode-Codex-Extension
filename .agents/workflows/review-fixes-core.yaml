  - id: T13_manifest_restore
    prompt: |
      リロード復元後に統合成果がワークスペースへ届かない問題を直す。
      「失敗が成功に見える」型の不具合のため、他のMEDIUM指摘より優先度が高い。

      根拠（監査エージェントの報告。着手前に自分で確認すること）:

      1. マニフェストが復元されない
         - src/orchestrator/runnerWorkingDirectory.ts:255 は、リロード復元時に
           new PseudoWorktreeIntegrationQueue() を空のマニフェストで作り直す
         - src/orchestrator/pseudoWorktree.ts:147 の serializeManifest と
           同:152 の deserializeManifest は本体コードのどこからも呼ばれておらず、
           参照はテストのみ。つまり統合済みパスの記録が永続化も復元もされていない

      2. その帰結として成果が黙って消える
         - src/orchestrator/runnerWorkingDirectory.ts:324 で復元後にrunが終了すると、
           reflectIntegrationToWorkspace は空マニフェストを走査して「0件反映」で成功扱いになる
         - 統合できていた成果がワークスペースへ届かないまま、エラーも警告も出ない

      3. 分岐元の読み取りに競合がある
         - src/orchestrator/runnerWorkingDirectory.ts:197 の resolveTaskBranchOrigin
           （統合worktreeのHEAD読み取り）が worktreeQueue の外で行われ、
           その後の worktreeQueue.create との間に別タスクのマージが割り込みうる
         - 分岐元が1マージ分古くなり、避けられたはずの衝突を生む

      変更内容:
      - マニフェストを統合ディレクトリ配下へ永続化し、復元時に読み戻す
      - 復元できない場合は「0件で成功」にせず、反映を行わずに明示的な警告を出す
        （黙って成果を捨てるより、人が気づける形にする方が安全）
      - resolveTaskBranchOrigin のHEAD読み取りと worktree 作成を同一の enqueue にまとめる

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、マニフェストの書き込みが失敗したときに
