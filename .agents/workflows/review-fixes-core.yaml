      - 復元できないときに黙って成功扱いにせず警告を出すことを検証するテスト
      - HEAD読み取りと worktree 作成が排他されることを検証するテスト
      - npm test / npm run typecheck / npm run lint が全緑
    done: マニフェストの永続化と復元が実装され復元不能時は警告を出し、HEAD読み取りが排他され、テストが追加され、全テストが緑で、差分の自己レビューを終えていること

