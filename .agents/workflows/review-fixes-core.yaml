        パースできなくなっていないか確認する
      - タイムアウト値が短すぎて正常な生成を打ち切らないか確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - 先行する別言語フェンスがある応答から正しくYAMLを取り出せることを検証するテスト
      - タスクが欠けた応答を検出することを検証するテスト
      - タイムアウトで打ち切られセッションが解放されることを検証するテスト
      - npm test / npm run typecheck / npm run lint が全緑
    done: フェンス選択と欠落検出とタイムアウトが実装され、テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T16_roadmap_parse
    dependsOn: [T10_untrusted_text, T15_planner]
    prompt: |
      ロードマップMarkdownのパースを堅くし、破壊的な自動修正の入力として安全にする。

      背景: ロードマップのパースは正規表現の直列読みで揺れに弱く、しかも
      alignRoadmapIssues という破壊的な自動修正の入力になっている。

      根拠（いずれも監査エージェントの報告。着手前に自分で確認すること）:

      1. Issue行のパターンが厳しすぎる（src/orchestrator/roadmap.ts:76）
         - ISSUE_LINE_PATTERN は `- Issue: #12` の完全一致しか受けない
         - `- Issue: #12（既存）` のような揺れで item.issue が undefined になり、
           src/orchestrator/roadmap.ts:541 の alignRoadmapIssues が生成YAMLの正しい issue: を
           機械的に削除して `Closes #<N>` の紐付けを失う

      2. チェックボックス行のパターンが厳しすぎる（src/orchestrator/roadmap.ts:74）
         - CHECKBOX_ITEM_PATTERN は行頭 `- [ ] ` の形しか受け付けず、
           インデントされた項目や `* [ ]` 表記は無言で捨てられる

      3. 改行コードが書き換わる（src/orchestrator/roadmap.ts:695）
         - applyRunCompletion は split して join('\n') で書き戻すため、
           チェック1個の更新でCRLFのロードマップ全体がLFへ書き換わる

      4. 重複idで意図しない行にチェックが入る（src/orchestrator/roadmap.ts:672）
         - itemsById は同一idの項目が複数あると後勝ちになり、applyRunCompletionToFile は
           validateRoadmap（重複をエラーにする）を経由しない

      5. slugifyGoal の二重実装（src/orchestrator/roadmap.ts:896）
         - planner.ts:547 と同名・別実装で、上限40文字と60文字、文字クラスも異なる
         - roadmap.ts 側だけ stripControlChars を通さないため、双方向制御文字やNULが
           そのままファイル名候補になる（現在の配線では未使用の経路）

      変更内容:
      - 行末の余剰テキストを許容するか、パース不能な Issue: 行を検出したら
        削除ではなく警告に倒す（自動修正は「確実に読めた項目」に限る）
      - 先頭の空白と `-` / `*` / `+` を許容し、チェックボックスらしき未マッチ行が
        残った場合は警告として返す
      - 元の改行コードを検出して復元する
      - 書き戻し前に重複idを検出し、その場合は何もせず警告を返す
      - slugifyGoal は planner.ts の実装へ一本化し、roadmap.ts 側は削除する

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、パースの緩和が誤検出を生まないか確認する
      - 破壊的な自動修正（alignRoadmapIssues）の発火条件が狭まっていることを確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - 揺れのあるIssue行・チェックボックス行を扱えることを検証するテスト
      - CRLFのロードマップが改行を保ったまま更新されることを検証するテスト
      - 重複idのときに書き戻さず警告を返すことを検証するテスト
      - npm test / npm run typecheck / npm run lint が全緑
    done: ロードマップのパースが揺れに耐え改行を保ち重複idで停止し slugifyGoal が一本化され、テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T17_stream_robustness
    dependsOn: [T05_connection_exit, T06_stream_exit]
    prompt: |
      ストリーム受信とプロセス終了の頑健性を上げる。T05 / T06 と同じファイルを触るため
      それらの後に実行する。

      根拠（いずれも監査エージェントの報告。着手前に自分で確認すること）:

      1. 受信バッファが無制限（src/codex/jsonRpc.ts:19 の consumeFrames、
         src/util/ndjson.ts:13 の consumeNdjson）
         - どちらも改行が来るまで buffer へ無制限に連結し続ける
         - CLI側が改行を含まない巨大な非JSON出力（診断ログの乱れ・バイナリ混入等）を
           吐き続けた場合、上限なくメモリを消費する

      2. kill にエスカレーションが無い（src/appserver/connection.ts:188、
         src/claude/streamSession.ts:1031、src/codex/appServerClient.ts:742 ほか全 proc.kill()）
         - いずれも既定のSIGTERM送信のみで、exit が実際に発火したかの確認や
           SIGKILLへのエスカレーションが無い
         - 子プロセスがハングしてSIGTERMに応答しない場合、回収されずに残り続ける

      3. finish 後に pending が宙に浮く（src/codex/appServerClient.ts:736 と 790）
         - finish() がタイムアウトや exit で先に確定した場合でも、body() が内部で
           待っている request() の Promise は未解決のまま放置される

      変更内容:
      - バッファ長に上限を設け、超過時は接続を切って再起動する
      - kill() 後に短いタイマーで exit 未発火なら kill('SIGKILL') する共通処理を用意し、
        全ての proc.kill() 呼び出しをそこへ寄せる
      - finish() 内で pending の残りエントリもエラー値で即時解決する

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、バッファ上限が正常な大きい応答を切ってしまわないか確認する
        （上限値の根拠を必ずコメントに残すこと）
      - SIGKILLのタイマーがプロセス正常終了後も残らないか確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - バッファ上限超過で接続が切られることを検証するテスト
      - SIGTERMに応答しないプロセスがSIGKILLされることを検証するテスト
      - finish 後に pending が解決されることを検証するテスト
      - npm test / npm run typecheck / npm run lint が全緑
    done: バッファ上限とSIGKILLエスカレーションとpendingの解放が実装され、テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T19_session_perf
    dependsOn: [T03_runner_dispose]
    prompt: |
      セッション一覧まわりの性能とキャッシュの3件を直す。src/extension.ts を触るため
      T03 の後に実行する。

      根拠（1件目は検証済み、他は監査エージェントの報告）:

      1. pruneCache が呼ばれない（検証済み）
         - src/session/sessionStore.ts:279 の pruneCache() は src 配下から一度も呼ばれていない
           （参照は test/unit/sessionStore.test.ts のみ）
         - 既定経路である thread/list 成功時の buildFromThreadList（sessionStore.ts:106 付近）は
           キャッシュ削除処理を一切通らない
         - このため thread/list が使える環境では、アーカイブ・削除済みセッションの SessionMeta が
           globalState の META_CACHE_KEY（src/extension.ts:139 と 274 付近）に溜まり続ける

      2. 逐次の mtime 取得（src/session/usageReader.ts:32、src/session/sessionStore.ts:185）
         - newestRollout() が全rolloutファイルへ mtimeMs を逐次（並列化なし）呼ぶ。
           app-server経由の使用量取得が失敗・未接続のときのフォールバックとして、
           会話中は onRolloutChanged の1.5秒debounceのたびに実行されうる
         - orderByRecency は listFromFiles 経路で maxEntries による絞り込み前に
           located全件へ mtimeMs を逐次呼ぶ

      3. basename の再実装（src/session/sessionStore.ts:47）
         - src/util/paths.ts:6 の basenameOf と同一目的・同一実装を再実装している
         - 同種の重複が src/provider/commandCatalog.ts:19 と src/claude/sessionStore.ts:14 にもある
         - util側は sessionTreeProvider.ts と sessionGrouping.ts では正しく利用されている

      変更内容:
      - activate() の起動時か適切な契機で store.pruneCache() を呼ぶ経路を追加する。
        起動時に呼ぶ場合は非同期で実行し、失敗してもactivateを妨げないようにする
      - mtime 取得を Promise.all で並列化するか、絞り込み後に限定する
      - basename の再実装を util/paths.ts の basenameOf へ一本化する

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、起動処理に同期的な重い処理を足していないか確認する
      - basename の統合で挙動が変わるエッジケース（末尾スラッシュ、Windowsのバックスラッシュ）を確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - pruneCache が実行経路から呼ばれることを検証するテスト
      - basename の統合後も既存テストが通ること
      - npm test / npm run typecheck / npm run lint が全緑
    done: pruneCacheが呼ばれmtime取得が並列化されbasenameが一本化され、テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T20_orchestrator_warn
    prompt: |
      オーケストレーターの警告が無制限に増える問題を直す。

      根拠（監査エージェントの報告。着手前に自分で確認すること）:
      - src/orchestrator/runnerOrchestrator.ts:252 の orchestratorPromptOverride の警告だけ
        重複排除も上限も無い
      - 同種の checkEffectivePermissionEscalation / checkMessagingPermissionEscalation は
        src/orchestrator/runnerSnapshot.ts:220 と 288 で alreadyWarned を見ている
      - update_task_prompt の呼び出し回数に上限が無いため live.warnings が無制限に伸び、
        その都度 notify でView全体へ送られる
      - あわせて src/orchestrator/runnerSnapshot.ts:103 の buildTaskSnapshot が
        タスクごとに store.find(runId)（memento全件走査）を呼ぶため、
        getSnapshot 1回でタスク数+1回のストア読み出しが起きる。notify は
        ストリーミング中の状態変化ごとに発火するので頻度が高い

      変更内容:
      - 同一taskIdの警告を直近1件へ丸めるか、件数上限を設ける
      - getSnapshot の先頭で1回引いた persisted を buildTaskSnapshot へ渡す

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、警告の丸めで重要な情報が失われないか確認する
        （警告が出た事実自体は残ること）
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - 同一taskIdの警告が無制限に増えないことを検証するテスト
      - getSnapshot のストア読み出しが1回になることを検証するテスト
      - npm test / npm run typecheck / npm run lint が全緑
    done: 警告の重複排除とスナップショットのストア読み出し削減が実装され、テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T21_integration_lock
    provider: claude
    dependsOn: [T04_retry_suffix, T13_manifest_restore]
    prompt: |
      統合worktreeの排他制御を調査し、必要なら修正する。
      このタスクは「未検証の指摘の裏取り」から始める点が他と異なる。

      監査エージェントはこれをCRITICAL 2件として報告したが、レビュー時に本体側での
      裏取りができていない。したがって、まず再現条件をコードから確認し、
      実際に問題があると確認できた場合にのみ修正すること。問題が無いと判断した場合は、
      なぜ無いのか（既存のどの仕組みが守っているのか）を報告して修正を見送ってよい。

      報告された内容（未検証）:

      1. 衝突解決中の統合worktreeが排他制御の外にある
         - src/orchestrator/runnerMerge.ts:372 は衝突時、統合worktreeを衝突状態のまま放置して
           衝突解決セッション（LLMの複数ターン）を開く
         - この「占有」は IntegrationMergeQueue の外にある
         - 並列タスクが同時期に完了すると src/orchestrator/integration.ts:403 の mergeTaskBranch が
           同じ統合worktreeで git merge を叩き、失敗後の
           src/orchestrator/integration.ts:412 の `git diff --diff-filter=U` が
           前の衝突の未解決パスを返すため、2件目も conflict と誤判定される

      2. abortMerge が他方の作業を巻き戻す
         - 上の状態で片方が abortAndBlock に到達すると、
           src/orchestrator/runnerMerge.ts:529 の abortMerge（git merge --abort）が
           もう一方の解決セッションの作業中インデックスごと巻き戻す
         - 破壊的操作の前に「自分が起こしたマージか」を確認していない

      3. 復元時のマージが一斉に走る（src/orchestrator/runnerRestore.ts:55）
         - 復元時に merging の全タスクへ同時に startMerge を投げるため、
           上の競合が復元直後にまとめて発火しうる

      4. 衝突解決セッションに上限が無い（src/orchestrator/runnerMerge.ts:455）
         - onStateChanged も承認ハンドラも付けず、タイムアウトも無い
         - 人が承認カードを放置すると merging のまま無期限に枠を占め、runが終わらない

      調査手順:
      - IntegrationMergeQueue の実装を読み、衝突解決中に他タスクの mergeTask が
        実行されうるかを確認する
      - 確認できたら、その状態で git diff --diff-filter=U が何を返すかを整理する
      - abortMerge の呼び出し条件と、そのとき MERGE_HEAD が何を指しているかを確認する

      修正する場合の方針:
      - 統合worktreeを「1度に1つの操作しか持てない資源」として明示的にリース化し、
        衝突解決の占有も IntegrationMergeQueue に載せる
      - abortMerge の実行前に、解決対象が現在の MERGE_HEAD に対応することを確認する
      - 復元経路のマージは1件ずつ直列に行う
      - MERGE_RESOLUTION_MAX_ITERATIONS とは別に経過時間の上限を設けるか、
        Viewから解決セッションを止められるようにする

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、リースの取得と解放が例外経路でも必ず対になっているか確認する
        （解放漏れはデッドロックになる）
      - git merge --abort の実行条件が十分に狭いか確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - 調査結果（問題の有無と根拠）が報告されていること
      - 問題があった場合は、並列マージ時に衝突解決が排他されることを検証するテストを追加する
      - npm test / npm run typecheck / npm run lint が全緑

      安全上の注意: git merge --abort を扱うコードなので、テストは実リポジトリを
      破壊しない形（一時リポジトリまたはモック）で書くこと。
    done: 統合worktreeの排他制御について調査結果が報告され問題があれば修正とテストが追加され、全テストが緑で、差分の自己レビューを終えていること

  # ================================================================
  # フェーズ3: テスト補強と構造リファクタ
  # ================================================================
  - id: T25_repo_hygiene
    provider: claude
    type: docs
    prompt: |
      リポジトリ衛生の課題を調査し、対処方針を文書としてまとめる。

      重要（安全上の制約）: このタスクでは破壊的操作を実行してはいけない。
      リモートブランチの削除、git filter-branch、force push、履歴の書き換えは
      いずれも実行せず、「何をすべきか」の提案だけを文書に残すこと。
      実行するかどうかは人が判断する。

      調査対象（レビューで観測済み）:

      1. リポジトリサイズ
         - git count-objects の size-pack が 48.5 MiB
         - docs/design.md が 729KB あり、156回のコミットで改訂されている
         - 累積の blob サイズを見ると上位10件がすべて docs/design.md の各版
         - つまり pack 肥大の主因はこのファイルの改訂履歴

      2. 不要ブランチ
         - origin/feat/327/workflow-branch-naming-conventions がマージ済みのまま残存している

      3. カバレッジ計測の不在
         - @vitest/coverage-v8 等が package.json に無く、vitest.config.ts にも coverage ブロックが無い
         - .gitignore に coverage/ はあるが生成する仕組みが無く形骸化している
         - CLAUDE.md の「Test coverage 80%以上」という規約を機械的に検証する術が無い

      変更内容:
      - docs/ 配下に調査結果と提案をまとめた文書を1つ作る
      - design.md については、分割（章ごとのファイルへ）・履歴の扱い・今後の運用の
        選択肢を並べ、それぞれの利点と欠点を書く。履歴書き換えは「可能だが推奨しない」
        理由も含めて書くこと（共有リポジトリでの force push の影響）
      - 残存ブランチは削除コマンドを提示するだけにとどめる
      - カバレッジ計測の導入手順と、閾値をいきなり80%にすべきでない理由
        （既存テストの実態を測ってから決める）を書く

      自己レビュー（完了前に必ず実施）:
      - 文書に破壊的コマンドを「実行してよい」と読める書き方をしていないか確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - docs/ 配下に提案文書が1つ追加されていること
      - 破壊的操作を実行していないこと
      - 提案がそれぞれ利点と欠点つきで書かれていること
    done: リポジトリ衛生の調査結果と提案が docs 配下の文書としてまとまり破壊的操作を実行しておらず、差分の自己レビューを終えていること

