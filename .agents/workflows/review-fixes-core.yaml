version: 1
name: review-fixes-core-2026-08-22
# 2026-08-22の全体レビュー（50k LOC / 162ファイルを7領域で並列監査）で挙がった指摘のうち、
# ワークフロー基盤側の修正計画。
#
# このファイルの役割は「各タスクの詳細指示（根拠・変更内容・受入基準・自己レビュー手順）の
# 原本」であり、タスクの担当分けはここでは決めない。現行の分割は
# docs/roadmap/review-and-feature-consolidation.md を見ること。
# 元々の core / ui / final の3分割は、そのロードマップの7ワークフロー（WF-A〜WF-G）へ
# 置き換わっている。このファイルの maxParallel / provider の指定も、分割の変更にともなって
# 参考値として扱う。
#
# 各タスクのpromptには「検証済み」「未検証」を明記してある。検証済みはレビュー時に
# 実際のコードを読んで根拠を確認したもの、未検証は監査エージェントの報告のままで
# 裏取りが済んでいないもの。未検証のタスクは修正前に再現条件の確認から始める。
#
# dependsOn は論理的な前後関係だけでなく、同じファイルを触るタスク同士の直列化にも
# 使っている。担当の分け方が変わっても、この前後関係は守ること。
#
# レビューは2段構えにしてある。
#  1. 各タスクが自分の差分を自己レビューしてから完了する（doneの条件に含めてある）
#  2. ワークフローの最後に全体レビューを1段置く（Z01_core_review / Z02_ui_review /
#     T27_final_review がその指示の原本）
#
# なお `done` の末尾には、拡張のワークフロー機能で実行する場合に限り runner が自動で
# 「かつすべての変更をコミットしてあること」を付け足す
# （src/orchestrator/runner.ts:1421 の withCommitRequirement）。
# 今回はワークフロー機能では実行しないため、コミットとPRは上記ロードマップの運用規約に従う。
defaults:
  provider: codex
  maxParallel: 3
  isolation: worktree
  cleanup: after-merge
  type: fix
  maxIterations: 20

tasks:
  - id: T01_ci
    type: ci
    prompt: |
      GitHub ActionsのCIワークフローを新規追加する。

      現状（検証済み）: リポジトリに .github/ ディレクトリが存在せず、.gitlab-ci.yml など
      他のCI設定も無い。scripts/check.sh（lint → typecheck → test）はローカル手動実行のみで、
      PRで機械検証される仕組みが皆無。vitestは145ファイル2830テストが通る状態だが、
      「書いてあるのに実行されない」リスクが常時ある。

      変更内容:
      - .github/workflows/ci.yml を新規作成する
      - トリガーは push（mainブランチ）と pull_request
      - Node.js 20 系（package.json の engines は node >=20）で npm ci を実行
      - npm run lint / npm run typecheck / npm test を実行する
      - 統合テスト（npm run test:integration）はVSCodeのダウンロードとxvfbが必要なため
        このタスクでは含めない。含めるかどうかは別途判断する
      - actions/checkout と actions/setup-node はメジャーバージョンを固定する
      - npm キャッシュを有効にして実行時間を抑える

      自己レビュー（完了前に必ず実施）:
      - git diff で変更差分を読み直し、意図しない変更が混ざっていないか確認する
      - ワークフローの権限設定（permissions）が必要最小限になっているか確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - .github/workflows/ci.yml が存在し、YAMLとして妥当であること
      - ワークフローが lint / typecheck / test の3つを実行すること
      - ローカルで scripts/check.sh を実行して全緑であること

      注意: このタスクは .github/ 配下のみを触る。src/ や test/ には手を入れない。
    done: .github/workflows/ci.yml が追加され、scripts/check.sh がローカルで全緑になり、差分の自己レビューを終えていること

  # ================================================================
  # フェーズ2: 検証済みの確定バグ
  # ================================================================
  - id: T02_waiting_reply_settle
    prompt: |
      waitingReply 状態のタスクがターン失敗時に確定せず、並列枠を永久に占有する不具合を直す。
      レビューで最も深刻と判断した指摘（CRITICAL）。根拠はコードを読んで検証済み。

      根拠（検証済み）:
      - src/orchestrator/runState.ts:234 の isUnsettled は pending / running / waitingApproval の
        3状態しか返さず、waitingReply を含まない
      - src/loop/loopController.ts:244 は paused（= waitingReply）中に turnFailed を観測すると
        stop('failed') を呼ぶ。コメント自身が「返信待ちのまま実は失敗していた、を黙って
        握り潰さない」と書いており、waitingReply 状態で failed が飛ぶ経路は設計上存在する
      - src/orchestrator/runner.ts:2485 が applyLoopStopReason(..., 'failed') を呼ぶが、
        src/orchestrator/runState.ts:396 の `if (!isUnsettled(current.state)) return run;` で
        素通りするため markFailed に到達せず、状態は waitingReply のまま残る
      - 一方 src/orchestrator/runner.ts:2487 の条件 `reason !== 'manual' && reason !== 'interrupted'`
        は真なので session.dispose() は実行される
      - 結果としてセッションは破棄済みなのにタスクは waitingReply のままとなり、
        isActiveTaskState が真を返し続けて maxParallel の枠を占有し、getRunOutcome が
        永久に running を返す

      重要な前提（誤解を避けるため）: manual / interrupted は runState.ts:375 で早期returnされ
      isUnsettled ガードに到達しないため、「全体の停止」ボタン自体は正しく動作する。
      stop() の対象リストにも waitingReply は含まれている。今回直すのは failed 経路のみ。

      変更内容:
      - isUnsettled に waitingReply を追加する
      - JSDoc の「この3状態」という記述を実態に合わせて更新する
      - runState.ts:33 の isActiveTaskState のJSDocが「状態を1つ足すたび3箇所を揃える」と
        書いている集合に isUnsettled も含まれることを明記する
      - merging を isUnsettled に含めるべきかどうかも検討し、含めない場合はその理由を
        コメントに残す（マージ中の停止理由の扱いは別の設計判断のため、安易に変えない）

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、状態集合の変更が他の判定へ想定外の影響を与えていないか確認する
      - isUnsettled を使っている全箇所を grep で洗い出し、waitingReply が加わることで
        挙動が変わる箇所をすべて把握したうえで、それが意図どおりか判断する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - waitingReply 状態のタスクに applyLoopStopReason(..., 'failed') を与えると failed へ確定する
        回帰テストを test/unit/runState.test.ts へ追加する
      - waitingReply 中に turnFailed を観測した場合にタスクが確定することを、
        test/unit/runner.test.ts のレベルでも確認する回帰テストを追加する
        （既存テストは running / waitingApproval しか検証していないため、この穴を塞ぐ）
      - manual / interrupted の既存挙動（タスク自身の状態を変えない）が変わっていないこと
      - npm test / npm run typecheck / npm run lint が全緑
    done: isUnsettled に waitingReply が含まれ、failed 経路での確定を検証する回帰テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T03_runner_dispose
    prompt: |
      WorkflowRunner.dispose() が一度も呼ばれず、オーケストレーターセッションが解放されない
      問題を直す。根拠はコードを読んで検証済み。

      根拠（検証済み）:
      - src/orchestrator/runner.ts:1463 の WorkflowRunner.dispose() は JSDoc で
        「拡張機能の終了時にオーケストレーターセッションを解放する」と契約しているが、
        `.dispose()` の呼び出しが src 配下に一つも無い
      - src/extension.ts:473 で生成した workflowRunner は context.subscriptions に登録されていない
      - src/extension.ts:1933 の deactivate() は「subscriptions で破棄されるため個別の後始末は不要」
        とコメントしているが、この runner はその subscriptions に載っていない

      変更内容:
      - src/extension.ts:536 の `workflowRunnerRef.current = workflowRunner;` の直後で
        context.subscriptions.push({ dispose: () => workflowRunner.dispose() }) を追加する
      - 同種の登録漏れを防ぐため、「生成したDisposableは生成直後に context.subscriptions へ
        登録する」という規約をコメントで明記する
      - extension.ts 内の他の生成物についても subscriptions への登録漏れが無いか確認し、
        漏れがあれば同様に登録する（発見した漏れは最終報告に明記する）

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、dispose の順序が他のDisposableと矛盾しないか確認する
      - dispose が二重に呼ばれても安全か確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - workflowRunner が context.subscriptions に登録されていること
      - 拡張の deactivate 時に dispose が呼ばれることを確認するテストを追加できるなら追加する
      - npm test / npm run typecheck / npm run lint が全緑

      注意: このタスクは src/extension.ts を触る。同じファイルを触る他タスクとは
      dependsOn で直列化してあるので、順序に従うこと。
    done: workflowRunner が context.subscriptions へ登録され、全テストが緑で、差分の自己レビューを終えていること

  - id: T04_retry_suffix
    prompt: |
      再試行時のworktree撤去が誤ったディレクトリを対象にする不具合を直す。
      人が調査用に残したworktreeを消す可能性があるため優先度が高い。

      根拠（監査エージェントの報告。着手前に自分で再確認すること）:
      - src/orchestrator/runnerMerge.ts:595 は
        retrySuffixOf(live.runState.tasks.get(taskId)?.retryCount) を呼んでおり、
        第2引数の manualRetryCount を渡していない
      - 一方、worktreeを作る側の src/orchestrator/runner.ts:1849 は retryCount と
        manualRetryCount の両方を渡して `-retry<n>` のサフィックスを決めている
      - src/orchestrator/runner.ts:2634 の retrySuffixOf のJSDoc自身が「合計する」と明記している
      - したがって手動再実行が1回でも行われていると、撤去対象のパスが実際に使っている
        worktreeとは別のディレクトリ（前の試行分。人が調査のために残してあるもの）になる

      変更内容:
      - runnerMerge.ts:595 の呼び出しを retrySuffixOf(state?.retryCount, state?.manualRetryCount) へ揃える
      - 同じ計算を複数箇所で書いていることが原因なので、サフィックス算出を1つの関数呼び出しに
        集約できないか検討する（呼び出し側が引数を1つ忘れるだけで別のディレクトリを指す
        設計自体が危うい）

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、パス算出の変更が撤去以外の経路へ波及していないか確認する
      - 破壊的操作（ディレクトリ削除）の対象が正しく絞られているか、境界条件（retryCount=0、
        manualRetryCount=0、両方undefined）を洗い出して確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - manualRetryCount が 1 以上のときに、生成側と撤去側が同じパスを指すことを検証する
        回帰テストを追加する
      - npm test / npm run typecheck / npm run lint が全緑

      安全上の注意: worktreeの削除を伴うコードなので、テストは実際のファイルシステムを
      破壊しない形（モックまたは一時ディレクトリ）で書くこと。
    done: 撤去側と生成側が同じサフィックスを算出することを検証する回帰テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T05_connection_exit
    prompt: |
      app-server接続の初期化失敗と接続断で、待機中のPromiseが解放されない問題を直す。

      根拠（1点目は検証済み、2点目以降は監査エージェントの報告）:

      1. 初期化未完了の接続を使い続ける（検証済み）
         - src/appserver/connection.ts:63 の ensureStarted() は this.proc !== undefined だけを見て
           早期returnする
         - src/appserver/connection.ts:76 で this.proc = proc を代入した後、
           src/appserver/connection.ts:99 で await this.request('initialize', ...) している
         - initialize が REQUEST_TIMEOUT_MS でタイムアウトしてもプロセス自体は生きているため
           exit ハンドラは発火せず reset() が呼ばれない。this.proc が残ったままになる
         - 以降の ensureStarted() は proc !== undefined で即座に成功扱いとなり、
           ハンドシェイクが完了していない壊れた接続を使い続ける

      2. 接続断が各セッションへ伝わらない（未検証。着手前に確認すること）
         - src/appserver/connection.ts:177 の reset() は自身の pending（RPC要求）だけを解決し、
           各 ChatSession に登録済みの waiting / waitingPrompts（承認カード・問い合わせフォーム）へは
           通知しない
         - AppServerConnection は全Codexスレッドで共有される単一プロセスのため、
           app-serverがクラッシュすると開いている全スレッドの承認待ちがタイムアウトも無く
           永久にハングする

      3. deniedReviews が dispose で解放されない（未検証。軽微）
         - src/appserver/chatSession.ts の dispose() は waiting / waitingPrompts のみ解放し、
           deniedReviews は対象外

      変更内容:
      - start() を try/catch で囲み、initialize が失敗したときは proc.kill() したうえで
        this.proc と this.starting をリセットする
      - AppServerConnection に接続断の通知経路（コールバック等）を追加し、reset() から
        呼び出し側が各 ChatSession の待機Promiseを解放できるようにする
      - ChatSession.dispose() で deniedReviews もクリアする
      - 2点目については、実際に ChatSession 側の waiting / waitingPrompts が
        接続断で解放されないことをコードで確認してから修正する。確認の結果すでに
        別経路で解放されているなら、その旨を報告して修正を見送ってよい

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、接続断の通知が二重に発火しないか確認する
      - reset() が再入したときに無限ループにならないか確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - initialize が失敗した後の ensureStarted() が再度起動を試みることを検証するテスト
      - 接続断で待機中のPromiseが解決されることを検証するテスト
      - npm test / npm run typecheck / npm run lint が全緑
    done: 初期化失敗時に接続がリセットされ、接続断が待機Promiseへ伝わることを検証するテストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T06_stream_exit
    prompt: |
      Claude CLIが異常終了したときに応答待ちのPromiseが解放されず永久ハングする問題を直す。
      根拠はコードを読んで検証済み。

      根拠（検証済み）:
      - src/claude/streamSession.ts:230 の proc.on('exit', ...) ハンドラは this.proc = undefined と
        state の busy: false / turnFailed: true を設定するだけ
      - 一方 src/claude/streamSession.ts:1003 の dispose() は waiting（承認）・rewindWaiting・
        mcpStatusWaiting・skillsWaiting をすべて明示的に解放しており、コメントも
        「放置するとawaitしている側が永遠に待つ」と書いている
      - exit / error ハンドラはこの解放処理を一切通らないため、CLIがクラッシュすると
        requestRewindFiles() / checkMcpStatus() / reloadSkills() のawait元が永久にハングする

      これは connection.ts と共通のパターンで、「dispose() 経路は丁寧だが exit / error 経路だけ
      解放が抜ける」という非対称がレビューで2ファイルにわたって観測されている。

      変更内容:
      - exit ハンドラと error ハンドラから、dispose() と同等の解放処理を呼ぶ
      - 解放処理を private メソッド（例: releasePendingWaiters）へ切り出し、
        dispose() と異常終了ハンドラの両方がそれを呼ぶ形にする。
        dispose() 側にはプロセスの kill と stdin の終了が含まれるので、
        「待機の解放」と「プロセスの後始末」を分けること
      - start() が同一インスタンス上で複数回呼ばれる（src/view/claudeChatView.ts の
        複数箇所から同じ entry.session に対して呼ばれる）ため、クラッシュと再起動を
        繰り返すと前プロセス分の未解決エントリがMapへ積み上がる。start() の冒頭で
        各Mapをクリアすべきか判断し、クリアする場合は理由をコメントに残す

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、解放処理が二重に走っても安全か確認する
      - dispose と異常終了の両方から呼ばれる関数が、部分的な状態でも正しく動くか確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
      - プロセスが応答前に exit したときに rewindWaiting / mcpStatusWaiting / skillsWaiting の
        await元が解決されることを検証する回帰テストを追加する
      - 承認待ち（waiting）についても同様に解放されることを確認する
      - start() の再呼び出しでMapが肥大しないことを確認する
      - npm test / npm run typecheck / npm run lint が全緑
    done: exit / error ハンドラが dispose と同等の待機解放を行い、それを検証する回帰テストが追加され、全テストが緑で、差分の自己レビューを終えていること

  - id: T07_pseudo_worktree_catch
    prompt: |
      疑似worktreeの統合・反映で未ハンドルrejectが起き、タスクが merging のまま枠を占有する
      問題を直す。

      根拠（監査エージェントの報告。着手前に自分で確認すること）:
      - src/orchestrator/runner.ts:2518 の `void integratePseudoWorktree(...)` は try/catch を持たない
      - その先の applyDiffToIntegration が呼ぶ src/orchestrator/pseudoWorktree.ts:340 付近の
        fs.mkdir / fs.copyFile は、他のポートメソッドと違って例外をcatchせずthrowする実装になっている
      - EACCES / ENOSPC などで未ハンドルrejectとなり、タスクは merging のまま永久に枠を占める
      - src/orchestrator/runner.ts:1823 の `void reflectPseudoWorktree(...)` も同様に無防備で、
        reflectIntegrationToWorkspace の fs.copyFile / fs.removeFile が throw すると
        run終了処理の途中で未ハンドルrejectになる

      変更内容:
      - integratePseudoWorktree の呼び出しを try/catch で包み、失敗を markMergeFailed へ落とす
      - reflectPseudoWorktree の呼び出しも同様に包み、失敗を警告として記録する
        （run終了処理の途中なので、ここで例外を投げると後始末が中断する）
      - pseudoWorktree.ts 側のポートメソッドが throw する設計と、他のポートメソッドが
        catchする設計が混在している点を確認し、どちらかへ揃えるべきか判断して報告する
      - runner.ts 内の他の `void someAsyncFn(...)` 形式についても、rejectしうるものが
        放置されていないか確認する。特に `void this.persist(runId)` は SerialQueue.enqueue が
        呼び出し元へrejectするPromiseを返すため、memento.update が失敗すると
        未ハンドルrejectになる。persist 内でcatchしてログへ落とす

      自己レビュー（完了前に必ず実施）:
      - git diff で差分を読み直し、catchが例外を握り潰すだけになっていないか確認する
        （必ずログか状態遷移のどちらかで失敗が可視化されること）
      - 失敗時にタスクが確実に終端状態へ落ちるか、経路を追って確認する
      - 指摘が出たら潰す。潰せないものは最終報告に残す

      受入基準:
