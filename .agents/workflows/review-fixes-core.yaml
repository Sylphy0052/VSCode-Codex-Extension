           つまり本文ではなく地の文を拾う
         - 監査時の実測では "これが定義です。\n" のような地の文が返ることが確認されている

      2. 切り詰められた応答が「成功」になる（同上）
         - 応答がタスク境界で切れた場合、YAMLとしては正しくパースできてしまう
           （yaml.parse は途中終了に寛容）
         - validateWorkflow も件数を知らないため、タスクが欠けた定義が成功として保存されうる

      3. 単発ターンにタイムアウトが無い（src/orchestrator/planner.ts:799）
         - sendSingleTurn の Promise はタイムアウトを持たず、onFinished が一度も
           呼ばれない終わり方（プロセス消滅・イベント取りこぼし）をすると永久に解決しない
         - finally の session.dispose() にも到達しないためセッションが残ったままコマンドが固まる

      変更内容:
      - 言語タグを見て yaml または無印のフェンスを優先し、複数候補があれば
        パースに成功したものを選ぶ
      - 期待タスク数（ロードマップ経路では材料の件数）との突き合わせを
        tryParseAndValidate の後に必ず行い、欠落があれば detectRoadmapMaterialMismatches と
        同じ扱いで人へ見せる
      - 上限時間つきの Promise.race で打ち切り、打ち切り時も dispose する
      - src/orchestrator/planner.ts:547 の slugifyGoal と roadmap.ts:896 の同名関数が
        別実装で二重に存在する問題も確認する（統合は T16 が担当するので、
        ここでは planner.ts 側を正とする前提で状況を報告するだけでよい）

      自己レビュー（完了前に必ず実施）:
